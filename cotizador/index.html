<title>Acceso privado</title>
<style>
:root{--bg:#17223A;--card:#1E2C49;--ink:#EAF0FB;--soft:#A9BBDC;--accent:#8DB4EA;--line:#2C3E63;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:360px;background:var(--card);border-radius:22px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 0 var(--line)}
h1{margin:0;font-size:24px}p{margin:0;color:var(--soft);font-size:14px}
input[type=password]{width:100%;font:600 17px system-ui;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#16213A;color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--soft)}
button{font:800 16px system-ui;padding:13px;border:0;border-radius:999px;background:var(--accent);color:#14203A;cursor:pointer}
#err{color:#F59A93;min-height:1.2em}
</style></head><body>
<form id="f" autocomplete="off">
  <h1>Acceso privado</h1>
  <p>Escribe tu contraseña para abrir el cotizador.</p>

  <label class="rem"><input type="checkbox" id="rem"> Recordar en este dispositivo</label>
  <button type="submit" id="go">Entrar</button>
  <p id="err" role="alert"></p>
</form>

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{e.preventDefault();go.disabled=true;go.textContent='Abriendo…';err.textContent='';
  try{if(document.getElementById('rem').checked){try{localStorage.setItem('nodo_cot',pw.value);}catch(x){}}await open(pw.value);}
  catch(x){err.textContent='Contraseña incorrecta.';go.disabled=false;go.textContent='Entrar';}});
let saved=null;try{saved=localStorage.getItem('nodo_cot');}catch(x){}
if(saved){open(saved).catch(()=>{try{localStorage.removeItem('nodo_cot');}catch(x){}});}
