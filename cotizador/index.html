const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function decryptQuote(password){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));
}

const f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();if(go.disabled)return;
  go.disabled=true;go.textContent='Abriendo…';err.textContent='';
  const unlocked=decryptQuote(pw.value);pw.value='';pw.disabled=true;
  try{
    const html=await unlocked;
    document.open();document.write(html);document.close();
    addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
  }catch(e){
    err.textContent='Contraseña incorrecta.';go.disabled=false;go.textContent='Entrar';
    pw.disabled=false;pw.focus();
  }
});
